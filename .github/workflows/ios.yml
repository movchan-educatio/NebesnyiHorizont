name: Build iOS (Signed & Unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: ios-build-ipa
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_TEMPLATE_DIR: 4.7.2.stable
  IOS_PRESET: iOS
  NAME: NebesnyiHorizont

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate export_presets.cfg encoding (UTF-8 without BOM)
        run: |
          python3 -c '
          data = open("export_presets.cfg", "rb").read()
          assert not data.startswith(b"\xef\xbb\xbf"), "export_presets.cfg must not have UTF-8 BOM"
          data.decode("utf-8")
          print("export_presets.cfg UTF-8 check OK:", len(data), "bytes")
          '

      - name: Cache Godot and iOS templates
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/godot
            ${{ runner.temp }}/templates
          key: godot-${{ env.GODOT_VERSION }}-ios-v1

      - name: Download Godot (macOS)
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/godot"
          if [ ! -x "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" ]; then
            curl -L --fail \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip" \
              -o "$RUNNER_TEMP/godot.zip"
            unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          fi
          GODOT="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          chmod +x "$GODOT"
          xattr -dr com.apple.quarantine "$RUNNER_TEMP/godot/Godot.app" || true
          rm -f "$RUNNER_TEMP/godot.zip"
          "$GODOT" --version

      - name: Download iOS export template
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/templates"
          if [ ! -f "$RUNNER_TEMP/templates/ios.zip" ]; then
            curl -L --fail \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" \
              -o "$RUNNER_TEMP/templates.tpz"
            rm -rf "$RUNNER_TEMP/tpl_extract"
            mkdir -p "$RUNNER_TEMP/tpl_extract"
            tar -xf "$RUNNER_TEMP/templates.tpz" -C "$RUNNER_TEMP/tpl_extract"
            find "$RUNNER_TEMP/tpl_extract" -name ios.zip -exec cp {} "$RUNNER_TEMP/templates/ios.zip" \;
            find "$RUNNER_TEMP/tpl_extract" -name version.txt -exec cp {} "$RUNNER_TEMP/templates/version.txt" \;
          fi
          test -f "$RUNNER_TEMP/templates/ios.zip"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_DIR}"
          cp "$RUNNER_TEMP/templates/ios.zip" \
            "$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_DIR}/ios.zip"
          cp "$RUNNER_TEMP/templates/version.txt" \
            "$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_DIR}/version.txt"
          rm -rf "$RUNNER_TEMP/templates.tpz" "$RUNNER_TEMP/tpl_extract"
          ls -lh "$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_DIR}"

      - name: Import project
        run: |
          set -e
          GODOT="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          "$GODOT" --headless --path . --import

      - name: Check signing secrets
        id: sign_check
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_MOBILEPROVISION_BASE64" ] && [ -n "$IOS_TEAM_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets detected: building signed IPA."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets absent: falling back cleanly to unsigned IPA."
          fi

      - name: Patch Team ID in export_presets.cfg when provided
        if: steps.sign_check.outputs.signed == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          python3 -c '
          import os, re
          team = os.environ["IOS_TEAM_ID"].strip()
          txt = open("export_presets.cfg", "r", encoding="utf-8").read()
          pattern = r"application/app_store_team_id=\"[^\"]*\""
          repl = "application/app_store_team_id=\"" + team + "\""
          txt = re.sub(pattern, repl, txt)
          with open("export_presets.cfg", "w", encoding="utf-8", newline="\n") as f:
              f.write(txt)
          '

      - name: Export Xcode project
        run: |
          set -e
          GODOT="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "$IOS_PRESET" \
            "build/ios/${NAME}.xcodeproj"
          ls -la build/ios

      - name: Patch iOS Launch Screen (Remove Engine Splash)
        run: |
          python3 -c '
          import glob, re, os, zlib, struct

          for sb in glob.glob("build/ios/**/*.storyboard", recursive=True):
              with open(sb, "r", encoding="utf-8") as f:
                  txt = f.read()
              cleaned = re.sub(r"<imageView[\s\S]*?</imageView>", "", txt)
              with open(sb, "w", encoding="utf-8") as f:
                  f.write(cleaned)
              print("Stripped imageView from", sb)

          def make_dark_png(w=16, h=16):
              raw_data = b""
              for _ in range(h):
                  raw_data += b"\x00" + b"\x05\x0d\x0a\xff" * w
              compressed = zlib.compress(raw_data)
              png = b"\x89PNG\r\n\x1a\n"
              ihdr = struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)
              png += struct.pack(">I", len(ihdr)) + b"IHDR" + ihdr + struct.pack(">I", zlib.crc32(b"IHDR" + ihdr))
              png += struct.pack(">I", len(compressed)) + b"IDAT" + compressed + struct.pack(">I", zlib.crc32(b"IDAT" + compressed))
              png += struct.pack(">I", 0) + b"IEND" + struct.pack(">I", zlib.crc32(b"IEND"))
              return png

          dark_bytes = make_dark_png(16, 16)

          for img_p in glob.glob("build/ios/**/*", recursive=True):
              lower = os.path.basename(img_p).lower()
              if ("splash" in lower or "launch" in lower) and lower.endswith(".png"):
                  try:
                      with open(img_p, "wb") as f:
                          f.write(dark_bytes)
                      print("Neutralized splash image:", img_p)
                  except Exception as e:
                      print("Error neutralizing", img_p, e)
          '

      - name: Force ASCII CFBundleDisplayName (AltStore 3009 fix)
        run: |
          python3 -c '
          import glob, plistlib, os, re

          for p in glob.glob("build/ios/**/*.plist", recursive=True):
              base = os.path.basename(p)
              if base == "Info.plist" or base.endswith("-Info.plist"):
                  try:
                      with open(p, "rb") as f:
                          pl = plistlib.load(f)
                  except Exception:
                      continue
                  if not isinstance(pl, dict):
                      continue
                  changed = False
                  for key in ("CFBundleDisplayName", "CFBundleName"):
                      if key in pl and pl[key] != "NebesnyiHorizont":
                          pl[key] = "NebesnyiHorizont"
                          changed = True
                  if "CFBundleExecutable" in pl and "CFBundleDisplayName" not in pl:
                      pl["CFBundleDisplayName"] = "NebesnyiHorizont"
                      changed = True
                  if changed:
                      with open(p, "wb") as f:
                          plistlib.dump(pl, f)
                  print("Patched plist:", p, "-> display=", pl.get("CFBundleDisplayName"), "name=", pl.get("CFBundleName"))

          for s in glob.glob("build/ios/**/InfoPlist.strings", recursive=True):
              with open(s, "wb") as f:
                  f.write(b"\"CFBundleDisplayName\" = \"NebesnyiHorizont\";\n")
              print("Patched InfoPlist.strings:", s)

          for pb in glob.glob("build/ios/**/*.pbxproj", recursive=True):
              txt = open(pb, "r", encoding="utf-8").read()
              new_txt = re.sub(
                  r"(INFOPLIST_KEY_CFBundleDisplayName\s*=\s*)[^;]+;",
                  r"\1\"NebesnyiHorizont\";",
                  txt,
              )
              if new_txt != txt:
                  open(pb, "w", encoding="utf-8").write(new_txt)
                  print("Patched pbxproj INFOPLIST_KEY_CFBundleDisplayName in", pb)
          '

      - name: Select newest available Xcode
        run: |
          set -e
          NEWEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Selecting $NEWEST_XCODE"
          sudo xcode-select -s "$NEWEST_XCODE"
          xcodebuild -version

      - name: Install Apple Certificate & Provisioning Profile
        if: steps.sign_check.outputs.signed == 'true'
        id: apple_creds
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS="ci-signing-keychain-$(date +%s)"
          P12_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$IOS_P12_BASE64" | base64 --decode > "$P12_PATH"
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          rm -f "$P12_PATH"

      - name: Build Signed Archive & Export IPA
        if: steps.sign_check.outputs.signed == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -eo pipefail
          PROFILE_UUID="${{ steps.apple_creds.outputs.profile_uuid }}"
          PROFILE_NAME="${{ steps.apple_creds.outputs.profile_name }}"
          xcodebuild archive \
            -project "build/ios/${NAME}.xcodeproj" \
            -scheme "${NAME}" \
            -archivePath "build/ios/App.xcarchive" \
            -derivedDataPath "build/DerivedData" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PROVISIONING_PROFILE="$PROFILE_UUID"
          rm -rf build/DerivedData

          cat > build/ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.nebesnyihorizont.game</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "build/ios/App.xcarchive" \
            -exportPath "build/ios/export" \
            -exportOptionsPlist "build/ios/ExportOptions.plist"
          cp build/ios/export/*.ipa "build/ios/${NAME}.ipa"
          ls -lh "build/ios/${NAME}.ipa"

      - name: Build Unsigned Archive & Package IPA (Fallback)
        if: steps.sign_check.outputs.signed != 'true'
        run: |
          set -eo pipefail
          xcodebuild archive \
            -project "build/ios/${NAME}.xcodeproj" \
            -scheme "${NAME}" \
            -archivePath "build/ios/App.xcarchive" \
            -derivedDataPath "build/DerivedData" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          rm -rf build/DerivedData
          python3 -c '
          import glob, plistlib
          for p in glob.glob("build/ios/App.xcarchive/Products/Applications/*.app/Info.plist"):
              with open(p, "rb") as f:
                  pl = plistlib.load(f)
              for k in ("CFBundleDisplayName", "CFBundleName"):
                  if pl.get(k) != "NebesnyiHorizont":
                      pl[k] = "NebesnyiHorizont"
              with open(p, "wb") as f:
                  plistlib.dump(pl, f)
              assert pl.get("CFBundleDisplayName", "").isascii(), "Non-ASCII CFBundleDisplayName!"
              print("Verified archive Info.plist:", p, pl.get("CFBundleDisplayName"), pl.get("CFBundleName"))
          '
          cd build/ios
          rm -rf Payload
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -qry "${NAME}-unsigned.ipa" Payload
          ls -lh "${NAME}-unsigned.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NebesnyiHorizont-ipa-${{ github.run_number }}
          path: build/ios/*.ipa
          if-no-files-found: error

      - name: Upload IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: "iOS build #${{ github.run_number }} (${{ steps.sign_check.outputs.signed == 'true' && 'Signed' || 'Unsigned' }})"
          body: |
            Automated iOS IPA build for **Nebesnyi Horizont**.
            Signed: `${{ steps.sign_check.outputs.signed }}`

            If unsigned, install via Sideloadly / AltStore. When `IOS_P12_BASE64`, `IOS_P12_PASSWORD`, `IOS_MOBILEPROVISION_BASE64`, and `IOS_TEAM_ID` GitHub Secrets are configured, this workflow outputs a signed App Store Connect `.ipa`.
          files: build/ios/*.ipa
          make_latest: true
